global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: "whatsapp-gateway"
    static_configs:
      - targets: ["gateway:8000"]
    metrics_path: "/metrics"

  - job_name: "whatsapp-worker"
    static_configs:
      - targets: ["worker:8002"]
    metrics_path: "/metrics"
