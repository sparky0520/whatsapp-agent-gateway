[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-agent-gateway"
version = "1.0.0"
description = "High-throughput WhatsApp Agent Gateway for Diagnostic Lab Bookings"
authors = [{ name = "Darsh Jain" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "redis>=5.1.0",
    "asyncpg>=0.30.0",
    "prometheus-client>=0.21.0",
    "openai>=1.54.0",
    "tabulate>=0.9.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
